<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <?!= include('Styles'); ?>
  <style>
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 20px; }
    .stat-card { background: var(--card); border-radius: var(--radius); padding: 18px 20px; box-shadow: 0 1px 2px rgba(26,29,41,0.04), 0 8px 24px rgba(26,29,41,0.05); }
    .stat-card .label { font-size: 12px; color: var(--ink-soft); font-weight: 600; margin-bottom: 4px; }
    .stat-card .value { font-size: 24px; font-weight: 800; color: var(--primary); }
  </style>
</head>
<body>
  <?!= include('Menu', {user: user, activePage: activePage, appUrl: appUrl}); ?>

  <div class="content">
    <div class="eyebrow">📚 Admin</div>
    <h2 style="margin-bottom: 20px;">Data Referensi</h2>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="label">Pegawai Terdaftar (REF_PEGAWAI)</div>
        <div class="value"><?= refCounts.pegawai ?></div>
      </div>
      <div class="stat-card">
        <div class="label">Tabel Tarif SBM (REF_TARIF)</div>
        <div class="value"><?= refCounts.tarifSheetAda ? 'Tersedia' : 'Belum ada' ?></div>
      </div>
    </div>

    <div class="card">
      <h2 style="font-size: 16px;">Kelola Data Referensi</h2>
      <p style="color: var(--ink-soft); font-size: 13.5px;">
        Data referensi (pegawai & tarif SBM) untuk saat ini dikelola langsung
        lewat spreadsheet, belum lewat form di aplikasi ini.
      </p>
      <a class="btn" href="<?= refCounts.spreadsheetUrl ?>" target="_blank">Buka Spreadsheet</a>
    </div>
  </div>
</body>
</html>
