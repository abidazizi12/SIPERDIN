<script>
  (function() {
    try {
      var nav = document.getElementById('siperdinNav');
      if (localStorage.getItem('siperdinNavCollapsed') === '1') nav.classList.add('collapsed');
    } catch (e) { /* localStorage tidak tersedia -- biarkan default (terbuka) */ }
  })();

  function toggleSiperdinNav() {
    var nav = document.getElementById('siperdinNav');
    nav.classList.toggle('collapsed');
    try { localStorage.setItem('siperdinNavCollapsed', nav.classList.contains('collapsed') ? '1' : '0'); } catch (e) {}
  }
</script>
