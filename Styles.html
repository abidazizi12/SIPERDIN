<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #1E40AF;
    --primary-dark: #14297A;
    --primary-soft: #E8EFFC;
    --gradient: linear-gradient(135deg, #0F2A6B 0%, #2050C7 55%, #38A9F5 100%);
    --teal: #14B8A6;
    --teal-soft: #E3F7F4;
    --bg: #F6F7FB;
    --card: #FFFFFF;
    --ink: #1A1D29;
    --ink-soft: #6B7280;
    --line: #EBECF2;
    --ok: #0F9D68;
    --ok-bg: #E5F7EF;
    --warn: #E08A00;
    --warn-bg: #FDF1DE;
    --danger: #E23D63;
    --danger-bg: #FCEBF0;
    --radius: 18px;
    --radius-sm: 12px;
    --sidebar-w: 248px;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', -apple-system, Arial, sans-serif;
    font-size: 14.5px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    min-height: 100vh;
  }

  /* Garis aksen gradasi tipis di paling atas viewport -- brand strip */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--gradient);
    z-index: 100;
  }

  h1, h2, h3 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    color: var(--ink);
    margin: 0 0 6px 0;
    letter-spacing: -0.02em;
  }

  p { margin: 0 0 8px 0; }

  code, .mono, .id-code {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.88em;
    background: var(--primary-soft);
    color: var(--primary-dark);
    padding: 2px 7px;
    border-radius: 6px;
  }

  a { color: var(--primary); }

  /* -------- Sidebar nav (kiri, fixed posisi agar nempel saat scroll) -------- */
  .siperdin-nav {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 3px;
    background: var(--card);
    padding: 14px 14px 22px;
    width: var(--sidebar-w);
    flex-shrink: 0;
    box-shadow: 1px 0 2px rgba(26,29,41,0.04), 10px 0 28px rgba(26,29,41,0.04);
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    overflow-y: auto;
    z-index: 40;
    transition: width 0.2s ease;
  }

  .siperdin-nav .nav-top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 20px;
  }

  .siperdin-nav .nav-toggle {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--bg);
    color: var(--primary);
    border: 1.5px solid var(--line);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s ease;
    flex-shrink: 0;
  }

  .siperdin-nav .nav-toggle:hover { background: var(--primary-soft); }

  .siperdin-nav .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 16.5px;
    color: var(--ink);
    letter-spacing: -0.01em;
    white-space: nowrap;
  }

  .siperdin-nav .brand .logo-mark {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: var(--gradient);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .siperdin-nav .nav-icon-svg { width: 18px; height: 18px; flex-shrink: 0; }
  .siperdin-nav .logo-mark .nav-icon-svg { width: 17px; height: 17px; }
  .siperdin-nav .nav-toggle .nav-icon-svg { width: 15px; height: 15px; }

  .siperdin-nav .nav-links {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .siperdin-nav a {
    display: flex;
    align-items: center;
    gap: 11px;
    color: var(--ink-soft);
    text-decoration: none;
    padding: 11px 14px;
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    font-weight: 600;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
  }

  .siperdin-nav a:hover {
    background: var(--bg);
    color: var(--ink);
  }

  .siperdin-nav a.active {
    background: var(--primary);
    color: #ffffff;
  }

  .siperdin-nav .spacer { flex: 1; }

  .siperdin-nav .user-badge {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px;
    border-radius: var(--radius-sm);
    background: var(--bg);
  }

  .siperdin-nav .user-badge .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--gradient);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px;
    flex-shrink: 0;
  }

  .siperdin-nav .user-badge .who { font-size: 12.5px; line-height: 1.3; flex: 1; min-width: 0; overflow: hidden; }
  .siperdin-nav .user-badge .who .name { font-weight: 600; color: var(--ink); white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
  .siperdin-nav .user-badge .who .role { color: var(--ink-soft); font-size: 11px; }
  .siperdin-nav .logout-link { flex-shrink: 0; font-size: 12px; font-weight: 600; display: flex; align-items: center; }

  /* Mode Collapsed Nav */
  .siperdin-nav.collapsed { width: 84px; padding-left: 10px; padding-right: 10px; }
  .siperdin-nav.collapsed .nav-top-row { flex-direction: column; gap: 10px; }
  .siperdin-nav.collapsed .nav-toggle { transform: rotate(180deg); }
  .siperdin-nav.collapsed .brand-text,
  .siperdin-nav.collapsed .nav-text,
  .siperdin-nav.collapsed .who {
    display: none;
  }
  .siperdin-nav.collapsed a { justify-content: center; padding: 11px 0; }
  .siperdin-nav.collapsed .user-badge { justify-content: center; padding: 10px 0; }
  .siperdin-nav.collapsed .logout-link { display: none; }

  /* -------- Layout Utama -------- */
  .content {
    flex: 1;
    min-width: 0;
    padding: 32px 40px 56px;
    width: 100%;
    margin-left: var(--sidebar-w);
    transition: margin-left 0.2s ease;
    position: relative;
  }

  .siperdin-nav.collapsed + .content { margin-left: 84px; }

  /* Glow radial halus di pojok kanan atas halaman */
  .content::before {
    content: '';
    position: absolute;
    top: -20px;
    right: -30px;
    width: 280px;
    height: 280px;
    background: radial-gradient(circle, rgba(56,169,245,0.14) 0%, rgba(30,64,175,0.07) 45%, transparent 72%);
    border-radius: 50%;
    filter: blur(6px);
    pointer-events: none;
    z-index: 0;
  }

  .content > .eyebrow, 
  .content > h2:first-of-type {
    position: relative;
    z-index: 1;
  }

  /* Aksen bar gradasi vertikal di sisi kiri judul utama */
  .content > h2:first-of-type {
    padding-left: 16px;
    margin-bottom: 24px !important;
    position: relative;
  }

  .content > h2:first-of-type::before {
    content: '';
    position: absolute;
    left: 0; 
    top: 3px; 
    bottom: 3px;
    width: 5px;
    border-radius: 4px;
    background: var(--gradient);
  }

  /* -------- Kartu & Elemen UI -------- */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 28px 30px;
    box-shadow: 0 1px 2px rgba(26,29,41,0.04), 0 12px 32px rgba(26,29,41,0.05);
    position: relative;
    z-index: 1;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    letter-spacing: 0.03em;
    color: var(--primary-dark);
    font-weight: 700;
    margin-bottom: 12px;
    background: linear-gradient(135deg, var(--primary-soft) 0%, var(--teal-soft) 100%);
    padding: 6px 14px;
    border-radius: 999px;
    box-shadow: 0 2px 8px rgba(30,64,175,0.08);
  }

  .status-pill {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 999px;
  }
  .status-pill.ok { background: var(--ok-bg); color: var(--ok); }
  .status-pill.warn { background: var(--warn-bg); color: var(--warn); }
  .status-pill.danger { background: var(--danger-bg); color: var(--danger); }

  .divider {
    height: 1px;
    background: var(--line);
    margin: 20px 0;
    border: none;
  }

  .note-box {
    background: var(--primary-soft);
    padding: 14px 18px;
    margin-top: 18px;
    font-size: 13.5px;
    color: var(--primary-dark);
    border-radius: var(--radius-sm);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--gradient);
    color: #fff;
    border: none;
    padding: 11px 22px;
    border-radius: 999px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: 13.5px;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(30,64,175,0.32);
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(30,64,175,0.42); }
  .btn.outline {
    background: var(--card);
    color: var(--ink);
    box-shadow: none;
    border: 1.5px solid var(--line);
  }
  .btn.outline:hover { background: var(--bg); }

  /* -------- Responsi Mobile (< 860px) -------- */
  @media (max-width: 860px) {
    body { flex-direction: column; }

    .siperdin-nav {
      width: 100% !important;
      height: auto;
      position: static;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      padding: 14px;
      box-shadow: 0 1px 2px rgba(26,29,41,0.04), 0 8px 24px rgba(26,29,41,0.06);
    }

    .siperdin-nav .nav-top-row { 
      padding: 4px 6px; 
      margin-right: 6px; 
      margin-bottom: 0; 
    }

    .siperdin-nav .nav-toggle { display: none; }
    .siperdin-nav .nav-links { flex-direction: row; flex-wrap: wrap; }
    .siperdin-nav .spacer { flex: 1; display: block; }
    .siperdin-nav .user-badge { margin-left: auto; }

    .siperdin-nav.collapsed .brand-text,
    .siperdin-nav.collapsed .nav-text,
    .siperdin-nav.collapsed .who,
    .siperdin-nav.collapsed .logout-link { display: inline; }
    .siperdin-nav.collapsed .logout-link { display: inline-flex; }

    .content, 
    .siperdin-nav.collapsed + .content { 
      margin-left: 0; 
      padding: 22px 16px 40px; 
    }
  }
</style>
